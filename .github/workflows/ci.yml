name: Checks

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render each kustomization
        run: |
          kubectl kustomize deploy/app > /dev/null
          kubectl kustomize deploy/policies > /dev/null
          kubectl kustomize deploy/autoscaling > /dev/null
          kubectl kustomize deploy/load > /dev/null
          kubectl kustomize deploy/monitoring > /dev/null
          kubectl kustomize deploy/platform/elastic > /dev/null

  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CHECKOV_VERSION: 3.4.3
      ZIZMOR_VERSION: 1.32.0
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools by version and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan for secrets
        run: gitleaks git --redact --no-banner

      - name: Check the workflows
        run: |
          actionlint
          pipx run "zizmor==$ZIZMOR_VERSION" --persona=regular .github/workflows

      - name: Scan the infrastructure and the manifests
        run: pipx run "checkov==$CHECKOV_VERSION" --quiet --compact --framework kubernetes --directory deploy --soft-fail

  title:
    name: Pull request title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Check Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
