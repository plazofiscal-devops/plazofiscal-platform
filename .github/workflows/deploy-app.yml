name: Deploy application

# Starts a rolling update of one service on the running cluster.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to roll out
        required: true
        type: choice
        options:
          - frontend
          - auth-api
          - todos-api
          - users-api
      image_tag:
        description: Image tag, for example sha-1a2b3c4
        required: true
        type: string

permissions: {}

concurrency:
  group: azure-platform
  cancel-in-progress: false

env:
  RESOURCE_GROUP: fiscal-plazo-demo-rg-main
  CLUSTER: fiscal-plazo-demo-aks-main

jobs:
  rollout:
    name: Roll out the service
    runs-on: ubuntu-24.04
    environment: azure-up
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials for this run only
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$CLUSTER" --admin

      - name: Roll out and wait
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9._-]+$ ]] || { echo "::error::invalid image tag"; exit 1; }
          kubectl --namespace plazofiscal set image "deployment/$SERVICE" \
            "$SERVICE=ghcr.io/plazofiscal-devops/$SERVICE:$IMAGE_TAG"
          kubectl --namespace plazofiscal annotate "deployment/$SERVICE" \
            "kubernetes.io/change-cause=$IMAGE_TAG" --overwrite
          kubectl --namespace plazofiscal rollout status "deployment/$SERVICE" --timeout=10m
