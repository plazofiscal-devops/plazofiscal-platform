apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: plazofiscal
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: auth-api
          image: plazofiscal/auth-api
          ports:
            - containerPort: 8081
          env:
            - name: AUTH_API_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: AUTH_API_PORT }
            - name: USERS_API_ADDRESS
              valueFrom:
                configMapKeyRef: { name: app-config, key: USERS_API_ADDRESS }
            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: ZIPKIN_URL_V2 }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /version, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /version, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            # Gives the endpoints time to drop the pod before it receives SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: plazofiscal
spec:
  selector:
    app: auth-api
  ports:
    - port: 8081
      targetPort: 8081
