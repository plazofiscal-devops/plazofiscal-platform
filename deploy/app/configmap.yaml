apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: plazofiscal
data:
  AUTH_API_PORT: "8081"
  TODO_API_PORT: "8082"
  SERVER_PORT: "8083"
  PORT: "8080"

  REDIS_HOST: "redis-queue"
  REDIS_PORT: "6379"
  REDIS_CHANNEL: "log_channel"

  AUTH_API_ADDRESS: "http://auth-api:8081"
  TODOS_API_ADDRESS: "http://todos-api:8082"
  USERS_API_ADDRESS: "http://users-api:8083"

  ZIPKIN_URL_V1: "http://jaeger-collector.observability:9411/api/v1/spans"
  ZIPKIN_URL_V2: "http://jaeger-collector.observability:9411/api/v2/spans"
  SPRING_ZIPKIN_BASE_URL: "http://jaeger-collector.observability:9411"

  LOG_PERSIST_PATH: "/data/processed.log"
