apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - auth-api.yaml
  - users-api.yaml
  - todos-api.yaml
  - frontend.yaml
  - log-message-processor.yaml
  - disruption-budgets.yaml
images:
  - name: plazofiscal/auth-api
    newTag: local
  - name: plazofiscal/users-api
    newTag: local
  - name: plazofiscal/todos-api
    newTag: local
  - name: plazofiscal/frontend
    newTag: local
  - name: plazofiscal/log-message-processor
    newTag: local
