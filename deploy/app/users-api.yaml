apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: plazofiscal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: users-api
          image: plazofiscal/users-api
          ports:
            - containerPort: 8083
          env:
            # Java 8 sizes its heap from the node memory, so the heap is capped to what the seeded users need.
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx192m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: SERVER_PORT }
            - name: SPRING_ZIPKIN_BASE_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: SPRING_ZIPKIN_BASE_URL }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
          startupProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 5
            failureThreshold: 24 # up to 120 s for the first start
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
            periodSeconds: 15
          lifecycle:
            # Gives the endpoints time to drop the pod before it receives SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 1000m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: plazofiscal
spec:
  selector:
    app: users-api
  ports:
    - port: 8083
      targetPort: 8083
