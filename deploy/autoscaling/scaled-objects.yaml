apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: frontend
  namespace: plazofiscal
spec:
  scaleTargetRef:
    name: frontend
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "65"
    # Monthly filing window, when firms close withholding and value added tax returns.
    - type: cron
      metadata:
        timezone: America/Bogota
        start: "0 7 8 * *"
        end: "0 20 24 * *"
        desiredReplicas: "3"
    # Income tax season, from August to October.
    - type: cron
      metadata:
        timezone: America/Bogota
        start: "0 7 1 8 *"
        end: "0 20 31 10 *"
        desiredReplicas: "4"
---
