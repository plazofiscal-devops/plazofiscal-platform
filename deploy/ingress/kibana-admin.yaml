# Kibana has no single sign-on on its free license, so after Keycloak the entry point signs in as the local admin.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kibana-admin
  namespace: ingress
spec:
  headers:
    customRequestHeaders:
      Authorization: Basic YWRtaW46YWRtaW4=
