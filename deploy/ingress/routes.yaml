# Every name passes Keycloak first. Paths under /oauth2 belong to oauth2-proxy on every name.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth
  namespace: ingress
spec:
  entryPoints: [web]
  routes:
    - match: Host(`auth.plazofiscal.localhost`)
      kind: Rule
      services:
        - { name: keycloak, namespace: identity, port: 8080 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: ingress
spec:
  entryPoints: [web]
  routes:
    - match: Host(`app.plazofiscal.localhost`) && PathPrefix(`/oauth2`)
      kind: Rule
      priority: 100
      services:
        - { name: oauth2-proxy, namespace: identity, port: 80 }
    - match: Host(`app.plazofiscal.localhost`)
      kind: Rule
      middlewares:
        - { name: sign-in, namespace: identity }
        - { name: require-user, namespace: identity }
      services:
        - { name: frontend, namespace: plazofiscal, port: 8080 }
