apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-load-test
  namespace: plazofiscal
spec:
  podSelector:
    matchLabels:
      app: load-test
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-load-test
  namespace: plazofiscal
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: load-test
      ports:
        - protocol: TCP
          port: 8080
