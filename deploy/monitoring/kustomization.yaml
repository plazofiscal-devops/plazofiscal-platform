apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alert-rules.yaml
  - todos-api-monitor.yaml
# Grafana loads every ConfigMap labeled grafana_dashboard.
# keda.json is the dashboard published by KEDA in config/grafana at v2.21.0, under the Apache 2.0 license.
configMapGenerator:
  - name: dashboard-keda
    namespace: observability
    files: [dashboards/keda.json]
    options:
      disableNameSuffixHash: true
      labels: { grafana_dashboard: "1" }
