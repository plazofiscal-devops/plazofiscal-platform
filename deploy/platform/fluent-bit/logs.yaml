# Fluent Bit 5.1.3 on every node, sending the container logs of plazofiscal to Logstash.
kind: DaemonSet
resources:
  requests: { cpu: 10m, memory: 24Mi }
  limits: { cpu: 200m, memory: 96Mi }
serviceMonitor:
  enabled: true
config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_plazofiscal_*.log
        multiline.parser cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        DB /var/log/flb_plazofiscal.db
        # The nodes share the inotify limit of the host machine, which other programs exhaust, so files are polled.
        Inotify_Watcher false
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        # JSON logs of the services go under app, so their fields never collide with the record fields.
        Merge_Log_Key app
        Keep_Log On
        Labels On
        Annotations Off
  outputs: |
    [OUTPUT]
        Name http
        Match kube.*
        Host logs-ls-http.observability.svc
        Port 8080
        Format json
        Json_Date_Key @timestamp
        Json_Date_Format iso8601
        Retry_Limit 5
# k3d nodes keep container logs under /var/log and have no /etc/machine-id, which the chart mounts by default.
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
