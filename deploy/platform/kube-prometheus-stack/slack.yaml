# Sends alerts to Slack. install.sh adds this file only when the webhook file exists, and mounts it from the Secret alert-webhook.
alertmanager:
  alertmanagerSpec:
    secrets: [alert-webhook]
  config:
    route:
      receiver: slack
      group_by: [alertname, namespace]
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alert-webhook/url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}Firing{{ else }}Resolved{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}{{ if .Annotations.description }}
              {{ .Annotations.description }}{{ end }}
              {{ end }}
