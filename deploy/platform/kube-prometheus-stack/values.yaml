# kube-prometheus-stack 93.1.0 for one local K3s cluster, with requests sized for nodes of 3 to 3.5 GiB.

# K3s runs the controller manager, scheduler, etcd and kube-proxy inside one process with no separate endpoints.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

prometheus:
  prometheusSpec:
    # Read monitors and rules from every namespace, with no release label required.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    retentionSize: 3GB
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: { storage: 4Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }

grafana:
  # The server node holds the control plane and Kibana, so Grafana runs on an agent.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  # Local access only, through make dashboards. Sign-in through Keycloak replaces it.
  adminUser: admin
  adminPassword: admin
  defaultDashboardsTimezone: America/Bogota
  # Keycloak signs people in. The route already required the second factor, so Grafana opens with no extra form.
  envFromSecret: grafana-oidc
  envValueFrom:
    ELASTIC_PASSWORD:
      secretKeyRef: { name: logs-es-elastic-user, key: elastic, optional: true }
  # Logs, events and traces for the business dashboard. ECK serves Elasticsearch with its own certificate authority.
  additionalDataSources:
    - name: Logs
      uid: logs
      type: elasticsearch
      url: https://logs-es-http.observability.svc:9200
      basicAuth: true
      basicAuthUser: elastic
      secureJsonData:
        basicAuthPassword: $ELASTIC_PASSWORD
      jsonData:
        index: logs-plazofiscal-*
        timeField: "@timestamp"
        logMessageField: message
        logLevelField: log.level
        tlsSkipVerify: true
    - name: Events
      uid: events
      type: elasticsearch
      url: https://logs-es-http.observability.svc:9200
      basicAuth: true
      basicAuthUser: elastic
      secureJsonData:
        basicAuthPassword: $ELASTIC_PASSWORD
      jsonData:
        index: logs-kubernetes.events-*
        timeField: "@timestamp"
        logMessageField: message
        logLevelField: event.type
        tlsSkipVerify: true
    - name: Jaeger
      uid: jaeger
      type: jaeger
      url: http://jaeger-collector.observability.svc:16686
  grafana.ini:
    server:
      root_url: http://grafana.plazofiscal.localhost:8000
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/plazofiscal.json
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      scopes: openid email profile
      auth_url: http://auth.plazofiscal.localhost:8000/realms/plazofiscal/protocol/openid-connect/auth
      token_url: http://auth.plazofiscal.localhost:8000/realms/plazofiscal/protocol/openid-connect/token
      api_url: http://auth.plazofiscal.localhost:8000/realms/plazofiscal/protocol/openid-connect/userinfo
      # Signing out clears the session of the entry point first, then the Keycloak session.
      signout_redirect_url: http://grafana.plazofiscal.localhost:8000/oauth2/sign_out?rd=http%3A%2F%2Fauth.plazofiscal.localhost%3A8000%2Frealms%2Fplazofiscal%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3Dgrafana%26post_logout_redirect_uri%3Dhttp%253A%252F%252Fgrafana.plazofiscal.localhost%253A8000%252F
      use_pkce: true
      allow_sign_up: true
      auto_login: true
      role_attribute_path: contains(groups[*], 'plataforma') && 'Admin' || 'Viewer'
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  sidecar:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 200m, memory: 192Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

nodeExporter:
  operatingSystems:
    aix: { enabled: false }
    darwin: { enabled: false }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }
