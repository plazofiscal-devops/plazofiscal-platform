# A page for people whose group cannot open the operations tools, with a way to sign in as someone else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forbidden-page
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels: { app: forbidden-page }
  template:
    metadata:
      labels: { app: forbidden-page }
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - { name: page, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: page
          configMap: { name: forbidden-page }
---
apiVersion: v1
kind: Service
metadata:
  name: forbidden-page
  namespace: identity
spec:
  selector: { app: forbidden-page }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forbidden
  namespace: identity
spec:
  errors:
    status: ["403"]
    service:
      name: forbidden-page
      port: 8080
    query: /
